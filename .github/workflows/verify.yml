name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (./evoke)
        run: ./evoke

      - name: DYLN frame smoke test
        run: python3 scripts/frame_smoke.py

      - name: Reproducibility check
        run: |
          cp -r build/out /tmp/out-first
          ./evoke
          diff -r /tmp/out-first build/out
          echo "reproducible: build/out byte-for-byte identical"
